version: 2

models:
  # --------------- dimensions ---------------
  - name: dim_stations
    description: |
      Station dimension for ML feature joins. Combines CWA weather stations
      and agricultural rain-fall stations into a single dimension. CWA wins
      on station_id collision.
    columns:
      - name: station_id
        description: CWA or rain-fall station ID (alphanumeric).
        tests: [not_null, unique]
      - name: station_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['有人站', '自動站', '農業雨量站']
      - name: station_source
        tests:
          - accepted_values:
              arguments:
                values: ['cwa', 'rain_fall']

  # --------------- 10-minute fact ---------------
  - name: fct_measurements_10min
    description: |
      Original 10-minute granularity weather observations for ML training,
      joined with dim_stations for context.

      Most fields carry TWO columns (per ADR-002):
        <field>_raw  STRING    original CWA value (preserves sentinels)
        <field>      FLOAT64   sentinel-translated, ready for ML

      For numeric fields:
        '-99' / '-999' / 'X'    → NULL
        wind_direction*: also '990' (calm wind)             → NULL
        precipitation:   '-98' (no rain 6h) / 'T' (trace)   → 0

      Precipitation and sunshine duration are special: per ADR-004 the CWA
      O-A0003-001 fields are DAILY-CUMULATIVE since Asia/Taipei midnight,
      not 10-min windows. So those carry THREE columns each:
        <field>_daily_cumulative_raw   STRING    raw CWA cumulative value
        <field>_daily_cumulative       FLOAT64   cleaned cumulative total
        <field>_10min_window           FLOAT64   LAG-diff-derived 10-min amount

      ML pipelines wanting per-bucket precipitation should read the
      `*_10min_window` column. Governance / debug that needs the daily
      running total reads `*_daily_cumulative`. The rollup facts
      (hourly/daily/weekly/monthly) SUM the window column.

      `has_*_sensor` flags distinguish "field not measured at this station"
      (NULL because the station does not have that sensor) from
      "measurement missing" (NULL because the snapshot was bad).

      See stg_observations docs for full sentinel-rule catalogue.
    columns:
      - name: station_id
        description: CWA station ID.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id
              # See severity rationale on the rollup facts below.
              config:
                severity: warn
      - name: measure_at
        description: Observation timestamp (UTC).
        tests: [not_null]
      - name: station_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['有人站', '自動站', '農業雨量站']
      - name: has_pressure_sensor
        description: Station carries a pressure sensor (only manned stations).
      - name: has_sunshine_sensor
        description: Station carries a sunshine sensor (only manned stations).
      - name: has_uv_sensor
        description: Station carries a UV sensor (only manned stations).

      # raw + cleaned pairs
      - name: air_temperature_raw
        description: Original CWA value (STRING). Sentinels 'X' / '-99'.
      - name: air_temperature
        description: Cleaned air temperature in °C (FLOAT64).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -30
                max_value: 50
                inclusive: true
              config:
                where: air_temperature is not null
      - name: air_pressure_raw
        description: Original CWA value (STRING).
      - name: air_pressure
        description: Cleaned station pressure in hPa.
        # Lower bound covers the lowest pressures ever recorded in Taiwan
        # (typhoon eye ~870 hPa). Upper bound generously above sea-level max.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 700
                max_value: 1100
                inclusive: true
              config:
                where: air_pressure is not null
      - name: relative_humidity_raw
        description: Original CWA value (STRING).
      - name: relative_humidity
        description: Cleaned relative humidity in %.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
              config:
                where: relative_humidity is not null
      - name: wind_speed_raw
        description: Original CWA value (STRING).
      - name: wind_speed
        description: Cleaned mean wind speed in m/s.
        # Highest sustained wind recorded in Taiwan is ~78 m/s (super typhoon).
        # 100 leaves headroom without going into clearly-spurious territory.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
              config:
                where: wind_speed is not null
      - name: wind_direction_raw
        description: Original CWA value (STRING). Sentinels 'X' / '-99' / '990' (calm wind).
      - name: wind_direction
        description: Cleaned mean wind direction in degrees. NULL if sentinel including '990'.
        # Compass degrees: [0, 360]. We accept 360 inclusive because CWA
        # encodes due north as 360 in some records (semantically == 0).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 360
                inclusive: true
              config:
                where: wind_direction is not null
      - name: wind_direction_gust_raw
        description: Original CWA value (STRING).
      - name: wind_direction_gust
        description: Cleaned wind direction at peak gust.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 360
                inclusive: true
              config:
                where: wind_direction_gust is not null
      - name: peak_gust_speed_raw
        description: Original CWA value (STRING).
      - name: peak_gust_speed
        description: Cleaned peak gust speed in m/s.
        # Gust ceiling sits above sustained-wind ceiling — gusts can be
        # substantially above mean wind speed in convective storms.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 150
                inclusive: true
              config:
                where: peak_gust_speed is not null
      - name: precipitation_daily_cumulative_raw
        description: |
          Original CWA value (STRING). Per ADR-004 this is the daily-cumulative
          rainfall (mm) since Asia/Taipei midnight, NOT a past-10-min amount.
          Sentinels 'X' / 'T' (trace) / '-99' / '-98' (no rain past 6h).
      - name: precipitation_daily_cumulative
        description: |
          Cleaned daily-cumulative rainfall (mm) since the current Asia/Taipei
          day's local midnight. Resets at 00:00 Asia/Taipei. 'T' and '-98'
          translated to 0. See ADR-004 for the spec discovery and reconciliation
          evidence (BigQuery cumulative endpoint matches CWA web-portal hourly
          CSV sum exactly).
        # Warn-tier ceiling: Taiwan typhoon daily-station record is ~1825 mm
        # (Morakot 2009 at 阿里山). 2500 leaves enough headroom for a
        # climate-shifted future without re-tuning the alert.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2500
                inclusive: true
              config:
                where: precipitation_daily_cumulative is not null
                severity: warn
      - name: precipitation_10min_window
        description: |
          True past-10-min precipitation (mm), derived in staging via LAG
          diff over (station_id, Asia/Taipei date). NULL at the first obs of
          each Taipei day's partition only when sentinel gaps prevent the
          diff; otherwise the first obs's cumulative value is treated as the
          window value. Monotonicity violations within a day are emitted as
          NULL (don't fabricate negative rainfall). See ADR-004.
        # 10-min precipitation upper bound: extreme convective cells in
        # Taiwan's mountains have hit ~100 mm in 10 min historically. 200
        # leaves headroom while still catching obvious bugs (negative, or
        # 4-digit values).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 200
                inclusive: true
              config:
                where: precipitation_10min_window is not null
      - name: sunshine_duration_daily_cumulative_raw
        description: Original CWA value (STRING). Daily cumulative per ADR-004. Only manned stations.
      - name: sunshine_duration_daily_cumulative
        description: |
          Cleaned daily-cumulative sunshine duration (hours) since the current
          Asia/Taipei day's local midnight. Resets at 00:00 Asia/Taipei. Only
          manned (有人站) stations populate this.
        # Warn-tier ceiling at 14h: solstice physical max in Taiwan ~14h.
        # Catches scale-of-10 / sign-error bugs while comfortably covering
        # any plausible real cumulative-daily value.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 14
                inclusive: true
              config:
                where: sunshine_duration_daily_cumulative is not null
                severity: warn
      - name: sunshine_duration_10min_window
        description: |
          True past-10-min sunshine duration (hours), derived in staging via
          LAG diff (same partitioning as precipitation_10min_window). Per ADR-004.
        # Physical max is 1.0h per hour; 1.5 catches scale-of-10 bugs while
        # tolerating a slightly-late tick from the cumulative source.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1.5
                inclusive: true
              config:
                where: sunshine_duration_10min_window is not null
      - name: uv_index_raw
        description: Original CWA value (STRING). Only manned stations.
      - name: uv_index
        description: Cleaned UV index.
        # WHO UV scale tops out at "extreme" = 11+. 25 is well above any
        # real-world reading; catches sign errors / scale-of-10 bugs.
        # Widened from 20 to 25 in PR #11 after observing legitimate
        # noon-summer readings at 21/22 from a small number of stations.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 25
                inclusive: true
              config:
                where: uv_index is not null
      - name: weather_status_raw
        description: Original weather phenomenon (STRING).
      - name: weather_status
        description: Cleaned weather phenomenon. NULL if raw was '-99' or 'X'.
      - name: visibility_raw
        description: Original visibility category (STRING).
      - name: visibility
        description: Cleaned visibility category.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, measure_at]

  # --------------- time-grain rollups ---------------
  - name: fct_measurements_hourly
    description: |
      Hourly rollup. One row per (station_id, hour). Bucket boundary in UTC.
      Per-column observation counts let consumers detect partial buckets
      (a full hour should have 6 observations at 10-minute cadence).
    columns:
      - name: station_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id
              # warn (not error) because dim_stations is the LATEST stations
              # snapshot from CWA. Historical fct rows may reference a station
              # that has since been decommissioned and dropped from the
              # current stations source — a real-world inconsistency, but not
              # one we want to fail the weekly build on. A persistent warn
              # signals we need to backfill dim or accept the drop.
              config:
                severity: warn
      - name: measure_at
        tests: [not_null]
      - name: observation_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 6
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, measure_at]

  - name: fct_measurements_daily
    description: |
      Daily rollup. One row per (station_id, day). Day boundary in
      Asia/Taipei. A full day has 144 observations (24 * 6).
    columns:
      - name: station_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id
              # warn (not error) because dim_stations is the LATEST stations
              # snapshot from CWA. Historical fct rows may reference a station
              # that has since been decommissioned and dropped from the
              # current stations source — a real-world inconsistency, but not
              # one we want to fail the weekly build on. A persistent warn
              # signals we need to backfill dim or accept the drop.
              config:
                severity: warn
      - name: measure_at
        tests: [not_null]
      - name: observation_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 144
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, measure_at]

  - name: fct_measurements_weekly
    description: |
      Weekly rollup. One row per (station_id, week-starting-Monday).
      Week boundary in Asia/Taipei. A full week has 1008 observations.
    columns:
      - name: station_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id
              # warn (not error) because dim_stations is the LATEST stations
              # snapshot from CWA. Historical fct rows may reference a station
              # that has since been decommissioned and dropped from the
              # current stations source — a real-world inconsistency, but not
              # one we want to fail the weekly build on. A persistent warn
              # signals we need to backfill dim or accept the drop.
              config:
                severity: warn
      - name: measure_at
        tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, measure_at]

  - name: fct_measurements_monthly
    description: |
      Monthly rollup. One row per (station_id, month-start). Month
      boundary in Asia/Taipei.
    columns:
      - name: station_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id
              # warn (not error) because dim_stations is the LATEST stations
              # snapshot from CWA. Historical fct rows may reference a station
              # that has since been decommissioned and dropped from the
              # current stations source — a real-world inconsistency, but not
              # one we want to fail the weekly build on. A persistent warn
              # signals we need to backfill dim or accept the drop.
              config:
                severity: warn
      - name: measure_at
        tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, measure_at]
