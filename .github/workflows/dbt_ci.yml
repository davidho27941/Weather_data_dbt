name: dbt CI

# Validates dbt changes on every PR that touches the dbt project or its
# orchestration. Runs against an isolated `weather_ci_*` dataset in
# side-project-staging using a GitHub-managed service account key.
#
# Steps:
#   1. dbt deps    — install package dependencies (dbt_utils)
#   2. dbt parse   — pure compile-time check (catches Jinja / YAML errors)
#   3. dbt build   — full build + tests against a 7-day bronze subsample
#                    (--full-refresh, ci_sample_days=7) so each run is
#                    deterministic and cheap (~minutes, ~half-million rows)
#
# Required secrets (repo / environment):
#   GCP_SA_KEY_CI      Service account key JSON, single line.
#                      SA needs:
#                        - roles/bigquery.user                       (project)
#                        - roles/bigquery.dataEditor                 (weather_ci_* — auto-created)
#                        - roles/bigquery.dataViewer                 (weather_raw)
#
# Required vars (repo / environment), defaulted to staging values:
#   GCP_PROJECT_ID     side-project-staging
#   BQ_LOCATION        asia-east1

on:
  pull_request:
    paths:
      - 'weather_data_dbt/**'
      - 'infra/dbt/**'
      - '.github/workflows/dbt_ci.yml'
  workflow_dispatch:

# Serialize across the repo so concurrent PRs don't trample the shared
# weather_ci_* dataset. PR runs supersede in-flight runs on the same ref.
concurrency:
  group: dbt-ci
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # reserved for future WIF migration; harmless with key auth

env:
  DBT_PROJECT_DIR: weather_data_dbt
  DBT_PROFILES_DIR: weather_data_dbt/profiles
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'side-project-staging' }}
  BQ_LOCATION: ${{ vars.BQ_LOCATION || 'asia-east1' }}
  DBT_CI_PROJECT: ${{ vars.GCP_PROJECT_ID || 'side-project-staging' }}
  BRONZE_PROJECT: ${{ vars.GCP_PROJECT_ID || 'side-project-staging' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt-bigquery
        run: pip install 'dbt-core>=1.8,<1.9' 'dbt-bigquery>=1.8,<1.9'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_CI }}

      - name: Stage profiles.yml from template
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: cp profiles/profiles.example.yml profiles/profiles.yml

      - name: dbt deps
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps

      - name: dbt parse
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt --no-use-colors parse --target ci

      - name: dbt build (sampled, full-refresh)
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: |
          dbt --no-use-colors build \
            --target ci \
            --full-refresh \
            --vars '{ci_sample_days: 7}'

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target-${{ github.run_id }}
          path: |
            ${{ env.DBT_PROJECT_DIR }}/target/run_results.json
            ${{ env.DBT_PROJECT_DIR }}/target/manifest.json
            ${{ env.DBT_PROJECT_DIR }}/target/compiled
          if-no-files-found: warn
          retention-days: 7
