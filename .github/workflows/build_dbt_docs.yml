name: dbt docs

# Generates `dbt docs` (manifest, catalog, static index.html) on every push
# to main that touches the dbt project, and publishes the static site to
# GitHub Pages.
#
# Compiles against the `stg` BigQuery target so the published catalog
# row counts / column metadata reflect the prod marts in
# `weather_{staging,intermediate,marts}` rather than the CI 7-day
# subsample in `weather_ci_*`. No models are built — `dbt docs generate`
# only reads INFORMATION_SCHEMA.
#
# Required secrets:
#   GCP_SA_KEY_CI     same SA key used by dbt_ci.yml.
#
# Required IAM (provisioned in terraform/bigquery.tf):
#   gha-ci has roles/bigquery.dataViewer on
#   weather_{staging,intermediate,marts} + weather_raw.

on:
  push:
    branches:
      - main
    paths:
      - 'weather_data_dbt/**'
      - '.github/workflows/build_dbt_docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # NOTE: do NOT name these DBT_PROJECT_DIR / DBT_PROFILES_DIR — dbt-core
  # picks those up automatically and combines with --project-dir, breaking
  # the path when also using `working-directory: weather_data_dbt`.
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'side-project-staging' }}
  BQ_LOCATION: ${{ vars.BQ_LOCATION || 'asia-east1' }}
  DBT_CI_PROJECT: ${{ vars.GCP_PROJECT_ID || 'side-project-staging' }}
  BRONZE_PROJECT: ${{ vars.GCP_PROJECT_ID || 'side-project-staging' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-bigquery
        # Match dbt_ci.yml — pinned to the local uv venv minor (1.11.x) so
        # CI can read the package-lock.yml shape produced locally.
        run: pip install 'dbt-core>=1.11,<1.12' 'dbt-bigquery>=1.11,<1.12'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_CI }}

      - name: Stage profiles.yml from template
        working-directory: weather_data_dbt
        run: cp profiles/profiles.example.yml profiles/profiles.yml

      - name: dbt deps
        working-directory: weather_data_dbt
        run: dbt deps --profiles-dir profiles

      - name: dbt docs generate
        working-directory: weather_data_dbt
        run: dbt --no-use-colors docs generate --target stg --profiles-dir profiles

      - name: Stage docs site
        run: |
          mkdir -p docs_site
          cp weather_data_dbt/target/index.html        docs_site/
          cp weather_data_dbt/target/manifest.json     docs_site/
          cp weather_data_dbt/target/catalog.json      docs_site/
          cp weather_data_dbt/target/run_results.json  docs_site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
