name: dbt docs

# Generates `dbt docs` (manifest, catalog, static index.html) on every push
# to main that touches the dbt project, and publishes the static site to
# GitHub Pages.
#
# Compiles against the `ci` BigQuery target (read access to weather_raw +
# weather_ci_* is enough to introspect schemas — no models are built here).
#
# Required secrets:
#   GCP_SA_KEY_CI     same SA key used by dbt_ci.yml.

on:
  push:
    branches:
      - main
    paths:
      - 'weather_data_dbt/**'
      - '.github/workflows/build_dbt_docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DBT_PROJECT_DIR: weather_data_dbt
  DBT_PROFILES_DIR: weather_data_dbt/profiles
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'side-project-staging' }}
  BQ_LOCATION: ${{ vars.BQ_LOCATION || 'asia-east1' }}
  DBT_CI_PROJECT: ${{ vars.GCP_PROJECT_ID || 'side-project-staging' }}
  BRONZE_PROJECT: ${{ vars.GCP_PROJECT_ID || 'side-project-staging' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt-bigquery
        run: pip install 'dbt-core>=1.8,<1.9' 'dbt-bigquery>=1.8,<1.9'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_CI }}

      - name: Stage profiles.yml from template
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: cp profiles/profiles.example.yml profiles/profiles.yml

      - name: dbt deps
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps

      - name: dbt docs generate
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt --no-use-colors docs generate --target ci

      - name: Stage docs site
        run: |
          mkdir -p docs_site
          cp ${DBT_PROJECT_DIR}/target/index.html        docs_site/
          cp ${DBT_PROJECT_DIR}/target/manifest.json     docs_site/
          cp ${DBT_PROJECT_DIR}/target/catalog.json      docs_site/
          cp ${DBT_PROJECT_DIR}/target/run_results.json  docs_site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
