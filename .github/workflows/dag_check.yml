name: dag check

# Validates the v_2_0_0 Airflow DAGs parse cleanly under the same uv-managed
# Airflow + Cosmos + dbt-bigquery stack the developer runs locally
# (see dev/README.md). Reuses dev/airflow_bootstrap.sh + dev/airflow_check.sh
# so CI and the local feedback loop can't drift.
#
# Triggered on any change that could plausibly break a DAG: the DAG files
# themselves, the dbt project they reference, the dev tooling, or this
# workflow.

on:
  pull_request:
    paths:
      - 'dags/**'
      - 'weather_data_dbt/**'
      - 'dev/**'
      - '.github/workflows/dag_check.yml'
  push:
    branches:
      - main
    paths:
      - 'dags/**'
      - 'weather_data_dbt/**'
      - 'dev/**'
      - '.github/workflows/dag_check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per (workflow × ref). PR pushes cancel earlier runs on the
  # same branch; main pushes run to completion.
  group: dag-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # The .venv-airflow directory holds ~500 MB of Airflow + Cosmos +
      # provider wheels; rebuilding it cold takes 3-5 min. Key on the
      # bootstrap script's hash so any version bump invalidates the
      # cache automatically.
      - name: Restore .venv-airflow cache
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv-airflow
          key: airflow-venv-${{ runner.os }}-py3.11-${{ hashFiles('dev/airflow_bootstrap.sh') }}

      - name: Bootstrap Airflow venv (on cache miss)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: ./dev/airflow_bootstrap.sh

      - name: Check DAGs parse cleanly
        run: ./dev/airflow_check.sh
